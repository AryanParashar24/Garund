receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

      http:
        endpoint: 0.0.0.0:4318


processors:
  batch:
    timeout: 5s
    send_batch_size: 1024


exporters:
  debug:
    verbosity: detailed

  prometheus:
    endpoint: 0.0.0.0:8889


service:
  pipelines:

    # Existing Garund telemetry
    traces:
      receivers:
        - otlp

      processors:
        - batch

      exporters:
        - debug


    # New reliability telemetry
    metrics:
      receivers:
        - otlp

      processors:
        - batch

      exporters:
        - prometheus